[project]
name = "dashboard"
version = "0.1.0"
description = "Дашборд для путешествия по Вьетнаму"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "httpx",
    "python-multipart",
    "itsdangerous",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "pyyaml",
    "jsonschema",
    "tiktoken==0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["acceptance: acceptance tests of a spec stage"]
